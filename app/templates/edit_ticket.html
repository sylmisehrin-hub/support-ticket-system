<!DOCTYPE html>
<html>
<head>
    <title>Edit Ticket - Support Ticket System</title>
</head>
<body>

<h2>Edit Ticket</h2>

<form method="POST">

    <label>Title</label><br>
    <input
        type="text"
        name="title"
        value="{{ ticket.title }}"
        required
    >
    <br><br>

    <label>Description</label><br>
    <textarea
        name="description"
        rows="5"
        cols="40"
        required
    >{{ ticket.description }}</textarea>
    <br><br>

    <label>Priority</label><br>
    <select name="priority">
        <option value="Low"
            {% if ticket.priority == "Low" %}selected{% endif %}>
            Low
        </option>

        <option value="Medium"
            {% if ticket.priority == "Medium" %}selected{% endif %}>
            Medium
        </option>

        <option value="High"
            {% if ticket.priority == "High" %}selected{% endif %}>
            High
        </option>
    </select>

    <br><br>

    <label>Status</label><br>
    <select name="status">
        <option value="Open"
            {% if ticket.status == "Open" %}selected{% endif %}>
            Open
        </option>

        <option value="In Progress"
            {% if ticket.status == "In Progress" %}selected{% endif %}>
            In Progress
        </option>

        <option value="Closed"
            {% if ticket.status == "Closed" %}selected{% endif %}>
            Closed
        </option>
    </select>

    <br><br>

    <button type="submit">Update Ticket</button>

</form>

<br>

<a href="{{ url_for('main.tickets') }}">Back to Tickets</a>

</body>
</html>
